<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Home</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="renewal-panel.css">
  <link rel="stylesheet" href="i18n.css">
</head>
<body>
  <!-- Wallpaper & Backdrops -->
  <div id="backdrop">
    <div id="wallpaper" class="wallpaper default-tahoe"></div>
    <div id="vignetteLeft"></div>
    <div id="vignetteTop"></div>
    <div id="vignetteBottom"></div>
  </div>

  <!-- Ambient glow in the colour of the focused dock app -->
  <div id="ambientA" class="ambient"></div>
  <div id="ambientB" class="ambient"></div>

  <!-- Top Bar: Greeting on the left; Pills + Clock on the right -->
  <header id="topBar">
    <div id="greeting">SELAMAT PAGI, AL-GHANI</div>
    <div id="topRight">
      <div id="topChips">
        <div class="chip" id="chipWeather" role="button" tabindex="0" title="Cuaca">
          <svg class="chip-icon" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
          <span id="weatherText">29°</span>
        </div>
        <div class="chip" id="chipPrayer" role="button" tabindex="0" title="Shalat">
          <svg class="chip-icon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/><path d="M19 3v4"/><path d="M21 5h-4"/></svg>
          <span id="prayerText">Dzuhur 11.56</span>
        </div>
        <div class="chip" id="chipAsk" role="button" tabindex="0" title="Tanya">
          <svg class="chip-icon" viewBox="0 0 24 24"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
          <span>Tanya</span>
        </div>
        <div class="chip" id="chipInputs" role="button" tabindex="0" title="Input TV">
          <svg class="chip-icon" viewBox="0 0 24 24"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
        </div>
        <div class="chip chip-avatar" id="chipAvatar" role="button" tabindex="0" title="Pengaturan & Profil">
          <img id="avatarImg" src="icons/avatar.jpg" alt="Al-Ghani" onerror="this.style.display='none'">
        </div>
      </div>
      <div id="clock">10.00</div>
    </div>
  </header>

  <!-- Editorial Hero Section (Eyebrow, Title, Hint, Action Button) -->
  <section id="heroSection">
    <div id="heroEyebrow">APLIKASI SISTEM</div>
    <h1 id="heroTitle">YouTube</h1>
    <div id="heroHint">Tahan OK untuk opsi</div>
    <button id="heroAction" class="hero-action-pill" role="button" tabindex="0">
      <svg class="hero-play-icon" viewBox="0 0 24 24"><polygon points="6 4 19 12 6 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>
      <span id="heroActionText">Buka YouTube</span>
    </button>
  </section>

  <!-- Viewport for Stage, Dock, Tooltip & Launchpad Grid -->
  <div id="viewport">
    <div id="stage">
      <div id="dockBand"></div>
      <div id="dockTooltip">YouTube</div>
      <div id="tiles"></div>
      <div id="glass"></div>
    </div>
  </div>

  <!-- Dropdown under the Inputs pill -->
  <div id="inputsPanel" class="hidden"></div>

  <div id="toast"></div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="catalogs.js"></script>
  <script src="apps.js"></script>
  <script src="app-library.js"></script>
  <script src="user-data.js"></script>
  <script src="release-notes.js"></script>
  <script src="update-panel.js"></script>
  <script src="renewal-panel.js"></script>
  <script src="profile-bootstrap.js"></script>
</body>
</html>
